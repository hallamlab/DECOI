<rect x="257" y="547" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="270" y="567" font-size="20" text-anchor="middle"><tspan x="270" dy="0">2</tspan></text>
<circle cx="410" cy="560" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<path d="M730 547 L743 560 L730 573 L717 560Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<circle cx="1060" cy="560" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="410" y="495" font-size="21" text-anchor="middle"><tspan x="410" dy="0">Study design and</tspan><tspan x="410" dy="24.78">reference identities</tspan></text>
<text x="730" y="495" font-size="23" text-anchor="middle"><tspan x="730" dy="0">Simulate communities;</tspan><tspan x="730" dy="27.14">apply biological effects</tspan></text>
<text x="1060" y="495" font-size="22" text-anchor="middle"><tspan x="1060" dy="0">Shared abundances</tspan><tspan x="1060" dy="25.96">and chemical truth</tspan></text>
<text x="730" y="597" font-size="19" text-anchor="middle"><tspan x="730" dy="0">SparseDOSSA2 / NumPy</tspan></text>
<path class="wire" d="M284.5 560 L396.5 560"/>
<path class="wire" d="M423.5 560 L714.879 560"/>
<path class="wire" d="M745.121 560 L1046.5 560"/>
<path class="wire" d="M270 574.5 L270 740.5"/>
<text x="125" y="745" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Assay effects</tspan><tspan x="125" dy="27.14">and controls</tspan></text>
<rect x="257" y="742" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="270" y="762" font-size="20" text-anchor="middle"><tspan x="270" dy="0">3</tspan></text>
<circle cx="410" cy="755" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<path d="M730 742 L743 755 L730 768 L717 755Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<circle cx="1060" cy="755" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="410" y="690" font-size="21" text-anchor="middle"><tspan x="410" dy="0">Shared pre-PCR</tspan><tspan x="410" dy="24.78">biological state</tspan></text>
<text x="730" y="690" font-size="23" text-anchor="middle"><tspan x="730" dy="0">Add assay-specific effects</tspan><tspan x="730" dy="27.14">and control allocations</tspan></text>
<text x="1060" y="690" font-size="22" text-anchor="middle"><tspan x="1060" dy="0">Amplicon and</tspan><tspan x="1060" dy="25.96">optional WGS truth</tspan></text>
<text x="730" y="792" font-size="19" text-anchor="middle"><tspan x="730" dy="0">DECOI / NumPy</tspan></text>
<path class="wire" d="M284.5 755 L396.5 755"/>
<path class="wire" d="M423.5 755 L714.879 755"/>
<path class="wire" d="M745.121 755 L1046.5 755"/>
<path class="wire" d="M270 769.5 L270 935.5"/>
<text x="125" y="940" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Read simulation</tspan><tspan x="125" dy="27.14">and validation</tspan></text>
<rect x="257" y="937" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="270" y="957" font-size="20" text-anchor="middle"><tspan x="270" dy="0">4</tspan></text>
<circle cx="410" cy="950" r="12" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<path d="M730 937 L743 950 L730 963 L717 950Z" fill="#F5F5F5" stroke="#666666" stroke-width="3"/>
<circle cx="1060" cy="950" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="410" y="885" font-size="21" text-anchor="middle"><tspan x="410" dy="0">Assay references</tspan><tspan x="410" dy="24.78">and read allocations</tspan></text>
<text x="730" y="885" font-size="23" text-anchor="middle"><tspan x="730" dy="0">Simulate paired reads;</tspan><tspan x="730" dy="27.14">optional amplicon validation</tspan></text>
<text x="1060" y="885" font-size="22" text-anchor="middle"><tspan x="1060" dy="0">Paired FASTQs and</tspan><tspan x="1060" dy="25.96">validation tables</tspan></text>
<text x="730" y="987" font-size="19" text-anchor="middle"><tspan x="730" dy="0">InSilicoSeq / DADA2</tspan></text>
<path class="wire" d="M284.5 950 L396.5 950"/>
<path class="wire" d="M423.5 950 L714.879 950"/>
<path class="wire" d="M745.121 950 L1046.5 950"/>
<path class="wire" d="M270 964.5 L270 1130.5"/>
<text x="125" y="1135" font-size="23" text-anchor="middle"><tspan x="125" dy="0">Results and</tspan><tspan x="125" dy="27.14">reproducibility</tspan></text>
<rect x="257" y="1132" width="26" height="26" rx="0" fill="#F5F5F5" stroke="#111111" stroke-width="3"/>
<text x="270" y="1152" font-size="20" text-anchor="middle"><tspan x="270" dy="0">5</tspan></text>
