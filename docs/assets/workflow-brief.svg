<circle cx="1060" cy="1145" r="12" fill="#D5E8D4" stroke="#82B366" stroke-width="3"/>
<text x="410" y="1080" font-size="21" text-anchor="middle"><tspan x="410" dy="0">Assays, metadata</tspan><tspan x="410" dy="24.78">and recorded effects</tspan></text>
<text x="730" y="1080" font-size="23" text-anchor="middle"><tspan x="730" dy="0">Assemble the dataset</tspan><tspan x="730" dy="27.14">and run summary</tspan></text>
<text x="1060" y="1080" font-size="22" text-anchor="middle"><tspan x="1060" dy="0">Report, manifests</tspan><tspan x="1060" dy="25.96">and truth tables</tspan></text>
<text x="730" y="1182" font-size="19" text-anchor="middle"><tspan x="730" dy="0">DECOI / pandas</tspan></text>
<path class="wire" d="M284.5 1145 L396.5 1145"/>
<path class="wire" d="M423.5 1145 L714.879 1145"/>
<path class="wire" d="M745.121 1145 L1046.5 1145"/>
<rect x="20" y="1245" width="1160" height="65" rx="12" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="600" y="1273" font-size="23" text-anchor="middle"><tspan x="600" dy="0">Matched assays, chemical measurements and recorded ground truth</tspan></text>
<text x="600" y="1298" font-size="19" text-anchor="middle"><tspan x="600" dy="0">FASTQs • Metadata • Truth tables • HTML report • Reproducibility manifest</tspan></text>
</svg>
