[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decoi"
version = "1.0.0"
description = "Truth-aware microbial study simulation with matched amplicon and shotgun reads"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy", "pandas", "scipy", "PyYAML", "biopython"]

[project.scripts]
decoi = "decoi.cli:main"

[project.urls]
Repository = "https://github.com/hallamlab/DECOI"
Documentation = "https://hallamlab-decoi.readthedocs.io"
Issues = "https://github.com/hallamlab/DECOI/issues"
