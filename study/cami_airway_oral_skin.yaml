# Preparation recipe, not a simulation configuration. The script writes config.yaml.
study_name: CAMI2_airway_oral_skin_amplicons
seed: 42
sites:
  Airways:
    samples: 20
    role: comparison
  Oral:
    samples: 20
    role: comparison
  Skin:
    samples: 20
    role: biological_control
# Multiply each source ASV weight by a lognormal draw, then renormalize.
# Source zeros remain zero. Variants are synthetic, not new human participants.
composition_log_sd: 0.35
amplicon_read_pairs: 30000
contaminant_asvs: 3
extraction_blanks: [PBS, PBS_twz, Negative_96, Negative_man]
aspire:
  comparison_groups: [Airways, Oral]
# Simulation overrides: exercise all applicable amplicon modules.
simulation_overrides:
  reference_fixtures:
    mitochondria:
      enabled: true
  artifacts:
    extraction_controls:
      # Expected pairs per contaminant ASV; Poisson draws use the study seed.
      # Low and high backgrounds exercise both sequencing QC and DB filtering.
      contaminant_mean_reads:
        PBS: 200
        PBS_twz: 600
        Negative_96: 4000
        Negative_man: 8000
    group_differential_abundance:
      enabled: true
      group_columns: [body_site]
      asvs_per_group: 6
      min_abs_log_fold_change: 0.5
      log_fold_change_sd: 0.25
      candidate_min_prevalence: 0.1
    microbial_network:
      enabled: true
      n_modules: 4
      asvs_per_module: 6
      loading: 0.5
      candidate_min_prevalence: 0.1
    microbiome_batch_effect:
      enabled: true
      log_fold_change: 0.5
    chemistry_batch_effect:
      enabled: true
    pcr_bias:
      enabled: true
    chimeras:
      enabled: true
      n_chimeras: 5
      fraction_of_reads: 0.02
  validation:
    run_dada2: true
